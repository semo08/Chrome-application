<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Momentum</title>
</head>

<body>
    <h2 id="clock">00:00</h2>
    <div id="weather" class="weather">
        <span></span>
        <span></span>
    </div>
    <form id="login-form" class="hidden">
        <input required maxlength="15" type="text" placeholder="What is your name?" />
        <input class="loginBtn" type="submit" value="Log In" />
    </form>
    <h1 id="greeting" class="hidden"></h1>
    <div class="middle-section">
        <div class="left-section">
        </div>
        <div class="right-section">
            <span id="todo-counter">You've got (0/50) todos.</span>
            <form id="todo-form">
                <input class="todoinput" type="text" placeholder="Write a To Do ✓ and Press Enter ↲" required />
            </form>
            <span class="undoInfo">Ctrl+Z to undo last delete</span>
            <ul id="todo-list"></ul>
        </div>
    </div>
    <div id="quote" class="quote">
        <span></span>
        <span></span>
    </div>

    <div id="toast" class="toast hidden">
        <span id="toast-message">Todo deleted</span>
        <button id="toast-undo-btn">Undo</button>
    </div>
    
    <script src="greetings.js"></script>
    <script src="clock.js"></script>
    <script src="quotes.js"></script>
    <script src="background.js"></script>
    <script src="todo.js"></script>
    <script src="config.js"></script>
    <script src="weather.js"></script>
</body>

</html>
